# Application Name & Port
spring.application.name=home-sweet-home-api
server.port=8080

# PostgreSQL Database Connection (Using your existing 'homesweethome' database on port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/homesweethome
spring.datasource.username=postgres
spring.datasource.password=Thush@1221
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# CRITICAL CHANGE: 'update' saves your data across restarts instead of wiping it
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always


# Never include exception details or request values in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Avoid authentication/request details in application logs.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.homesweethome=INFO

# Base64-encoded random key, at least 32 decoded bytes. Keep stable across restarts.
security.jwt.secret=${JWT_SECRET}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
